name: Deploy Python GCP resources

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project name
        required: true
        default: programming
        type: string
      environment:
        description: Deployment environment
        required: true
        default: python
        type: string
      region:
        description: GCP region
        required: true
        default: us-central1
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-python-${{ inputs.project }}-${{ inputs.environment }}-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GCP resources
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      # Inputs reach the shell as variables, never as script text.
      INPUT_PROJECT: ${{ inputs.project }}
      INPUT_ENVIRONMENT: ${{ inputs.environment }}
      INPUT_REGION: ${{ inputs.region }}
      ADDITIONAL_DB_NETWORK_TAGS: ${{ secrets.ADDITIONAL_DB_NETWORK_TAGS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r python-programming/requirements.txt

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy Python GCP resources
        run: >-
          python python-programming/deploy-gcpresources.py
          "$INPUT_PROJECT"
          "$INPUT_ENVIRONMENT"
          "$INPUT_REGION"
          "$GCP_PROJECT_ID"
