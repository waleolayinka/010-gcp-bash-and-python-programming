name: Deploy Bash GCP resources

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project name
        required: true
        default: programming
        type: string
      environment:
        description: Deployment environment
        required: true
        default: bash
        type: string
      region:
        description: GCP region
        required: true
        default: us-central1
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-bash-${{ inputs.project }}-${{ inputs.environment }}-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GCP resources
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      # Inputs reach the shell as variables, never as script text.
      INPUT_PROJECT: ${{ inputs.project }}
      INPUT_ENVIRONMENT: ${{ inputs.environment }}
      INPUT_REGION: ${{ inputs.region }}
      ADDITIONAL_DB_NETWORK_TAGS: ${{ secrets.ADDITIONAL_DB_NETWORK_TAGS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install figlet for banners
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq figlet

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Deploy Bash GCP resources
        shell: bash
        run: |
          bash bash-programming/deploy-gcpresources.sh \
            "$INPUT_PROJECT" \
            "$INPUT_ENVIRONMENT" \
            "$INPUT_REGION" \
            "$GCP_PROJECT_ID"
