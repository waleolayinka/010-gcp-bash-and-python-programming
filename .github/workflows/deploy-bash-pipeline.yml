name: Deploy Bash GCP resources

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project name
        required: true
        default: programming
        type: string
      environment:
        description: Deployment environment
        required: true
        default: bash
        type: string
      region:
        description: GCP region
        required: true
        default: us-central1
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-bash-${{ inputs.project }}-${{ inputs.environment }}-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GCP resources
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      # Inputs reach the shell as variables, never as script text.
      INPUT_PROJECT: ${{ inputs.project }}
      INPUT_ENVIRONMENT: ${{ inputs.environment }}
      INPUT_REGION: ${{ inputs.region }}
      ADDITIONAL_DB_NETWORK_TAGS: ${{ secrets.ADDITIONAL_DB_NETWORK_TAGS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install figlet for banners
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq figlet

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Deploy Bash GCP resources
        shell: bash
        run: |
          bash bash-programming/deploy-gcpresources.sh \
            "$INPUT_PROJECT" \
            "$INPUT_ENVIRONMENT" \
            "$INPUT_REGION" \
            "$GCP_PROJECT_ID"
