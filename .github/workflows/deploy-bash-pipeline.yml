name: Deploy Bash GCP resources

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project name
        required: true
        default: programming
        type: string
      environment:
        description: Deployment environment
        required: true
        default: bash
        type: string
      region:
        description: GCP region
        required: true
        default: us-central1
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-bash-${{ inputs.project }}-${{ inputs.environment }}-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GCP resources
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      ADDITIONAL_DB_NETWORK_TAGS: ${{ secrets.ADDITIONAL_DB_NETWORK_TAGS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install figlet for banners
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq figlet

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Bash GCP resources
        shell: bash
        run: |
          bash bash-programming/deploy-gcpresources.sh \
            "${{ inputs.project }}" \
            "${{ inputs.environment }}" \
            "${{ inputs.region }}" \
            "$GCP_PROJECT_ID"
