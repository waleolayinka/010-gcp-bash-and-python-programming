name: Destroy Python GCP resources

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project name
        required: true
        default: programming
        type: string
      environment:
        description: Deployment environment
        required: true
        default: python
        type: string
      region:
        description: GCP region
        required: true
        default: us-central1
        type: string
      confirm_destroy:
        description: Confirm permanent deletion of database data and bucket contents
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: destroy-python-${{ inputs.project }}-${{ inputs.environment }}-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy GCP resources
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - name: Require explicit destructive confirmation
        if: ${{ inputs.confirm_destroy != true }}
        run: |
          echo "Set confirm_destroy to true to delete this deployment." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r python-programming/requirements.txt

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Destroy Python GCP resources
        run: >-
          python python-programming/destroy-gcpresources.py
          "${{ inputs.project }}"
          "${{ inputs.environment }}"
          "${{ inputs.region }}"
          "$GCP_PROJECT_ID"
          --yes
